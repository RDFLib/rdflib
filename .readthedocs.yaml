---
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2
# https://docs.readthedocs.com/platform/stable/intro/zensical.html
build:
  os: "ubuntu-24.04"
  tools:
    python: "3"
  jobs:
    post_create_environment:
    - pip install uv
    post_install:
    # RDF4J is needed to document rdflib.contrib.rdf4j
      - uv export --frozen --no-dev --group docs --extra rdf4j --no-emit-project -o requirements.txt
      - uv pip install --system --no-cache -r requirements.txt
      - uv pip install --system --no-deps .
    build:
      html:
        - python -m docs.gen_ref_pages
        - python -m zensical build
    post_build:
    - mkdir -p $READTHEDOCS_OUTPUT/html/
    - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
