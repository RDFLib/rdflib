version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # auto widens ranges only while Dependabot detects rdflib as a library, i.e.
    # PyPI's summary for the latest release equals [project].description. If they
    # differ (e.g. the description is edited before a release), auto falls back to
    # increase and raises lower bounds.
    versioning-strategy: auto
    ignore:
      # We only use setuptools for a couple of things in the test suite
      # There is no need to keep it bleeding-edge. There are too frequent
      # updates to setuptools, requires too much maintenance to keep it up to date.
      - dependency-name: setuptools
        versions:
          - ">=72.0"
      - dependency-name: types-setuptools
        versions:
          - ">=72.0"
      # Ignore types-setuptools patch-level updates, because they issue too many!
      - dependency-name: types-setuptools
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: docker/latest/
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: docker/latest/
    schedule:
      interval: weekly
    versioning-strategy: auto
  - package-ecosystem: docker
    directory: docker/unstable/
    schedule:
      interval: weekly
